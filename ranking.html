  const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const show = async (key) => {
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.data));
    return new TextDecoder().decode(buf);
  };
  // document.open() is ignored while the gate page is still parsing, so wait for it to finish
  const ready = () => document.readyState === 'loading' ? new Promise((r) => addEventListener('DOMContentLoaded', () => setTimeout(r), { once: true })) : Promise.resolve();
  const render = async (html) => { await ready(); document.open(); document.write(html); document.close(); };
  const KEY = 'bgb-key-' + P.salt;
  try {

  document.getElementById('f').addEventListener('submit', async (ev) => {

    const err = document.getElementById('e');
    err.textContent = '';
    document.body.classList.add('wait');
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('p').value), 'PBKDF2', false, ['deriveKey']);
