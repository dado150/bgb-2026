      try { localStorage.setItem(KEY, btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))))); } catch (_) {}
      await render(html);
    } catch (e) {
      document.body.classList.remove('wait');
      err.textContent = 'Wrong password.';
    }
  });
})();
</script>
